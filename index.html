<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#075e54">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">
          <i class="fas fa-plus"></i> Obrolan Baru
        </button>
      </div>
      <div id="chat-history-list" class="chat-history-list">
        <!-- Daftar riwayat via JS -->
      </div>
    </div>

    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- AREA UTAMA -->
    <div class="chat-container">
      <div class="chat-header">
        <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div class="avatar-header">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus&backgroundColor=ffffff" alt="Bot Avatar">
        </div>
        <div class="header-info">
          <h2>Nexus AI</h2>
          <span id="status-text">Online</span>
        </div>
        
        <!-- Tombol Header Kanan -->
        <div class="header-actions">
          <button id="theme-btn" class="icon-btn" title="Mode Gelap"><i class="fas fa-moon"></i></button>
          <button id="settings-btn" class="icon-btn" title="Pengaturan"><i class="fas fa-cog"></i></button>
        </div>
      </div>
      
      <div id="chat-box" class="chat-box">
        <!-- Pesan muncul di sini -->
      </div>

      <!-- Tombol Scroll ke Bawah -->
      <button id="scroll-bottom-btn" class="scroll-bottom-btn" style="display: none;">
        <i class="fas fa-arrow-down"></i>
      </button>
      
      <div class="input-area">
        <div id="image-preview-container" class="image-preview-container" style="display: none;">
          <img id="image-preview" src="" alt="Preview">
          <button id="cancel-image-btn" class="cancel-image-btn"><i class="fas fa-times"></i></button>
        </div>

        <div class="input-controls">
          <input type="file" id="image-input" accept="image/*" hidden>
          <button id="upload-btn" class="icon-btn" title="Unggah Gambar"><i class="fas fa-image"></i></button>
          <button id="mic-btn" class="icon-btn" title="Bicara"><i class="fas fa-microphone"></i></button>
          
          <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
          
          <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <!-- MODAL PENGATURAN -->
    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <h3><i class="fas fa-sliders-h"></i> Pengaturan AI</h3>
        <label>Kepribadian AI (System Prompt):</label>
        <textarea id="persona-input" rows="3" placeholder="Contoh: Kamu adalah guru matematika yang sabar..."></textarea>
        
        <div class="modal-actions">
          <button id="export-chat-btn" class="btn-secondary"><i class="fas fa-download"></i> Ekspor Chat</button>
          <button id="close-settings-btn" class="btn-primary">Simpan & Tutup</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
