<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PWA & TITLE -->
  <title>Nexus AI</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="Asisten AI Multi-Model buatan sendiri.">
  
  <!-- Dukungan PWA untuk iOS (iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus AI">
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/bottts/png?seed=Nexus&backgroundColor=ffffff&size=192">

  <!-- LIBRARY CSS (Highlight.js & FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS UTAMA -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- SIDEBAR (RIWAYAT CHAT) -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">
          <i class="fas fa-plus"></i> Obrolan Baru
        </button>
      </div>
      <div id="chat-history-list" class="chat-history-list">
        <!-- Daftar riwayat akan muncul di sini via JS -->
      </div>
    </div>

    <!-- OVERLAY GELAP SAAT SIDEBAR TERBUKA -->
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- AREA UTAMA CHAT -->
    <div class="chat-container">
      <div class="chat-header">
        <!-- Tombol Hamburger Menu -->
        <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div class="avatar-header">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus&backgroundColor=ffffff" alt="Bot Avatar">
        </div>
        <div class="header-info">
          <h2>Nexus AI</h2>
          <span>Online</span>
        </div>
      </div>
      
      <div id="chat-box" class="chat-box">
        <!-- Pesan akan muncul di sini -->
      </div>
      
      <div class="input-area">
        <div id="image-preview-container" class="image-preview-container" style="display: none;">
          <img id="image-preview" src="" alt="Preview">
          <button id="cancel-image-btn" class="cancel-image-btn"><i class="fas fa-times"></i></button>
        </div>

        <div class="input-controls">
          <input type="file" id="image-input" accept="image/*" hidden>
          <button id="upload-btn" class="upload-btn"><i class="fas fa-image"></i></button>
          <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
          <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

  </div>

  <!-- LIBRARY JAVASCRIPT (Marked & Highlight) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- SCRIPT UTAMA -->
  <script src="script.js"></script>
  <script>
  // Hapus elemen badge dari halaman setelah dimuat
  document.addEventListener('DOMContentLoaded', function() {
    const badgeIframe = document.querySelector('iframe[title="Powered by Netlify"]');
    if (badgeIframe) {
      badgeIframe.remove(); // Hapus elemen dari DOM
    }
  });
  </script>

  <!-- PENDAFTARAN SERVICE WORKER PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('PWA ServiceWorker siap!');
          })
          .catch(err => {
            console.log('PWA ServiceWorker gagal: ', err);
          });
      });
    }
  </script>
</body>
</html>
