<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar-header">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus&backgroundColor=ffffff" alt="Bot Avatar">
      </div>
      <div class="header-info">
        <h2>Nexus AI</h2>
        <span>Online</span>
      </div>
    </div>
    
    <div id="chat-box" class="chat-box">
      <!-- Pesan akan muncul di sini -->
    </div>
    
    <!-- Area Input yang Diperbarui -->
    <div class="input-area">
      <!-- Pratinjau Gambar (Tersembunyi secara default) -->
      <div id="image-preview-container" class="image-preview-container" style="display: none;">
        <img id="image-preview" src="" alt="Preview">
        <button id="cancel-image-btn" class="cancel-image-btn"><i class="fas fa-times"></i></button>
      </div>

      <div class="input-controls">
        <input type="file" id="image-input" accept="image/*" hidden>
        <button id="upload-btn" class="upload-btn" title="Unggah Gambar"><i class="fas fa-image"></i></button>
        <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
        <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
