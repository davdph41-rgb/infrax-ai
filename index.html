<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Nexus AI</title>

<!-- TAMBAHKAN KODE PWA DI SINI -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#075e54">

<!-- Dukungan untuk iOS (iPhone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus AI">
<link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/bottts/png?seed=Nexus&backgroundColor=ffffff&size=192">
  <link rel="stylesheet" href="style.css?v=99">
</head>
<body>
  <div class="app-container">
    
    <!-- OVERLAY (Ditaruh paling atas agar urusan klik jelas) -->
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="createNewChat()">
          <i class="fas fa-plus"></i> Obrolan Baru
        </button>
      </div>
      <div id="chat-history-list" class="chat-history-list"></div>
    </div>

    <!-- AREA UTAMA CHAT -->
    <div class="chat-container">
      <div class="chat-header">
        <!-- TOMBOL MENU DIBUAT MERAH UNTUK TES -->
        <button id="menu-btn" class="menu-btn" onclick="toggleSidebar()" style="background: red; padding: 10px; border-radius: 5px;">
          <i class="fas fa-bars"></i>
        </button>
        
        <div class="avatar-header">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus&backgroundColor=ffffff" alt="Bot Avatar">
        </div>
        <div class="header-info">
          <h2>Nexus AI</h2>
          <span>Online</span>
        </div>
      </div>
      
      <div id="chat-box" class="chat-box"></div>
      
      <div class="input-area">
        <div id="image-preview-container" class="image-preview-container" style="display: none;">
          <img id="image-preview" src="" alt="Preview">
          <button id="cancel-image-btn" class="cancel-image-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="input-controls">
          <input type="file" id="image-input" accept="image/*" hidden>
          <button id="upload-btn" class="upload-btn"><i class="fas fa-image"></i></button>
          <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
          <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js?v=99"></script>
    <!-- TAMBAHKAN KODE PENDAFTARAN SERVICE WORKER DI SINI -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('PWA ServiceWorker siap!');
          })
          .catch(err => {
            console.log('PWA ServiceWorker gagal: ', err);
          });
      });
    }
  </script>
</body>
</html>
</body>
</html>
