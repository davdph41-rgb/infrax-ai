<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI</title>
  
  <!-- Tema warna untuk blok kode (Atom One Dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <!-- FontAwesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar-header">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus&backgroundColor=ffffff" alt="Bot Avatar">
      </div>
      <div class="header-info">
        <h2>Nexus AI</h2>
        <span>Online</span>
      </div>
    </div>
    
    <div id="chat-box" class="chat-box">
      <!-- Pesan akan muncul di sini -->
    </div>
    
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off">
      <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Library untuk Parsing Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
